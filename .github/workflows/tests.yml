name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Versionsprüfung
        run: python tools/version.py --check
      - name: Bibliotheksversionen fest (keine ^/~-Bereiche)
        run: python tools/pin_libs.py --check --dir firmware/MeshCore
      - name: JavaScript-Tests (ohne Playwright)
        run: npm ci --omit=optional && npm test
      - name: Python-Tests
        run: |
          set -e
          for t in tests/*.test.py; do echo "== $t"; python "$t"; done
      - name: C++-Tests
        run: |
          set -e
          for t in tests/*.test.cpp; do
            n=$(basename "$t" .cpp)
            echo "== $t"
            g++ -std=c++17 -Wall -Wextra -Werror -I tests/fakes "$t" -o "/tmp/$n"
            "/tmp/$n"
          done
