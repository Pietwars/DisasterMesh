name: Projektseite (GitHub Pages)

# Baut docs/site mit Bildern und Live-Demo und veröffentlicht sie auf GitHub Pages.
# Voraussetzung: Repository-Einstellungen → Pages → Source: „GitHub Actions“.
on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'docs/images/**', 'web/**', 'maps/**', 'tools/build_site.py', 'tools/build_demo.py', 'tools/web_assets.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/site/**', 'docs/images/**', 'tools/build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/site.test.py
      - run: python tools/build_site.py _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
