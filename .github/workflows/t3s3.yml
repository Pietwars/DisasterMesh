name: Build T3-S3 V1.3
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Überholte Läufe abbrechen: Ein neuer Push auf denselben PR bzw. Nicht-main-Branch bricht den älteren Lauf ab.
# main, Tags und manuelle Läufe bekommen je eine eigene Gruppe (run_id) und werden nie abgebrochen oder verdrängt.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}
jobs:
  t3s3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Volle Matrix (SX1262 + SX1276) nur auf main, Tags und bei manuellem Start; in PRs und auf anderen Branches
        # nur die T3-S3 SX1262 (alle Rollen), die SX1276-Variante des T3-S3 baut dann erst main.
        chip: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) && '["sx1262", "sx1276"]' || '["sx1262"]') }}
        role: [wifi, wifi_sd, repeater, room]
        include:
          - chip: sx1262
            role: wifi_gps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python tests/board_profiles.test.py
      - run: python tests/sx1262_package.test.py
      - name: Weboberfläche einbetten und auf Abweichung prüfen
        run: python tools/embed_web.py && git diff --exit-code -- firmware/MeshCore/examples/companion_radio/PortalPage.h firmware/MeshCore/examples/companion_radio/PortalAssets.h
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_t3s3_${{ matrix.chip }}_${{ matrix.role }}
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_t3s3_${{ matrix.chip }}_${{ matrix.role }} -t mergebin
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_t3s3_${{ matrix.chip }}_${{ matrix.role }} -t buildfs
      - uses: actions/upload-artifact@v4
        with:
          name: disahrsterradio-t3s3-${{ matrix.chip }}-${{ matrix.role }}
          path: |
            firmware/MeshCore/.pio/build/disaster_t3s3_${{ matrix.chip }}_${{ matrix.role }}/firmware.bin
            firmware/MeshCore/.pio/build/disaster_t3s3_${{ matrix.chip }}_${{ matrix.role }}/firmware-merged.bin
            firmware/MeshCore/.pio/build/disaster_t3s3_${{ matrix.chip }}_${{ matrix.role }}/spiffs.bin
          if-no-files-found: error

      - name: Package confirmed SX1262 hardware for Windows
        if: matrix.chip == 'sx1262' && matrix.role != 'wifi_gps'
        run: python tools/package_sx1262.py --role ${{ matrix.role }} --output test-results/SX1262-${{ matrix.role }}
      - name: Verify SX1262 package without a board
        if: matrix.chip == 'sx1262' && matrix.role != 'wifi_gps'
        run: python test-results/SX1262-${{ matrix.role }}/flash_sx1262.py Check
      - uses: actions/upload-artifact@v4
        if: matrix.chip == 'sx1262' && matrix.role != 'wifi_gps'
        with:
          name: DisAHRsterRadio-SX1262-Windows-${{ matrix.role }}
          path: test-results/SX1262-${{ matrix.role }}/
          if-no-files-found: error
