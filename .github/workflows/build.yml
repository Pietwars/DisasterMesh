name: Build DisAHRsterRadio TTGO
on:
  push:
    # Nur main und Versions-Tags; PR-Branches laufen über pull_request (keine Doppelläufe push + pull_request)
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Überholte Läufe abbrechen: Ein neuer Push auf denselben PR bzw. Nicht-main-Branch bricht den älteren Lauf ab.
# main, Tags und manuelle Läufe bekommen je eine eigene Gruppe (run_id) und werden nie abgebrochen oder verdrängt.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install platformio==6.2.0
      - name: Versionsprüfung (VERSION ist die einzige Quelle)
        run: python tools/version.py --check
      - run: npm ci
      - run: npm test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/history.test.cpp -o /tmp/history-test && /tmp/history-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/repeater.test.cpp -o /tmp/repeater-test && /tmp/repeater-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/room.test.cpp -o /tmp/room-test && /tmp/room-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I tests/fakes tests/outbox.test.cpp -o /tmp/outbox-test && /tmp/outbox-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/tx_budget.test.cpp -o /tmp/tx-budget-test && /tmp/tx-budget-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/admin.test.cpp -o /tmp/admin-test && /tmp/admin-test
      - name: Akku-Statuszeile der Marken-Anzeige (Hosttest, aus DisAHRsterRadio-MeshCore 0.9.4)
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror tests/batt_trend.test.cpp -o /tmp/batt-trend-test && /tmp/batt-trend-test
      - run: python tests/tools.test.py
      - run: python tests/diagnostics.test.py
      - name: Weboberfläche einbetten und auf Abweichung prüfen
        run: python tools/embed_web.py && git diff --exit-code -- firmware/MeshCore/examples/companion_radio/PortalPage.h firmware/MeshCore/examples/companion_radio/PortalAssets.h
      - name: Flash- und Speicherprüfung (Hosttests, aus DisAHRsterRadio-MeshCore 0.9.4)
        run: python tests/memory_validation.test.py -v
      - name: Firmware bauen
        shell: bash
        run: set -o pipefail; python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_wifi | tee build-disaster_ttgo_wifi.log
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_wifi -t mergebin
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_wifi -t buildfs
      - name: Flash/Header/Partitionen/Firmware und RAM prüfen
        run: >-
          python tools/validate_memory.py --env disaster_ttgo_wifi
          --build-dir firmware/MeshCore/.pio/build/disaster_ttgo_wifi --build-log build-disaster_ttgo_wifi.log
          --output memory/disaster_ttgo_wifi && cat memory/disaster_ttgo_wifi.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: disahrsterradio-ttgo-testbuild
          path: |
            firmware/MeshCore/.pio/build/disaster_ttgo_wifi/firmware.bin
            firmware/MeshCore/.pio/build/disaster_ttgo_wifi/firmware-merged.bin
            firmware/MeshCore/.pio/build/disaster_ttgo_wifi/spiffs.bin
          if-no-files-found: error

  repeater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_repeater
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_repeater -t mergebin
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_repeater -t buildfs
      - uses: actions/upload-artifact@v4
        with:
          name: disahrsterradio-ttgo-repeater-testbuild
          path: |
            firmware/MeshCore/.pio/build/disaster_ttgo_repeater/firmware.bin
            firmware/MeshCore/.pio/build/disaster_ttgo_repeater/firmware-merged.bin
            firmware/MeshCore/.pio/build/disaster_ttgo_repeater/spiffs.bin
          if-no-files-found: error

  room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_room
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_room -t mergebin
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_room -t buildfs
      - uses: actions/upload-artifact@v4
        with:
          name: disahrsterradio-ttgo-room-testbuild
          path: |
            firmware/MeshCore/.pio/build/disaster_ttgo_room/firmware.bin
            firmware/MeshCore/.pio/build/disaster_ttgo_room/firmware-merged.bin
            firmware/MeshCore/.pio/build/disaster_ttgo_room/spiffs.bin
          if-no-files-found: error

  sd_portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_wifi_sd
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_wifi_sd -t mergebin
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e disaster_ttgo_wifi_sd -t buildfs
      - uses: actions/upload-artifact@v4
        with:
          name: disahrsterradio-ttgo-sd-testbuild
          path: |
            firmware/MeshCore/.pio/build/disaster_ttgo_wifi_sd/firmware.bin
            firmware/MeshCore/.pio/build/disaster_ttgo_wifi_sd/firmware-merged.bin
            firmware/MeshCore/.pio/build/disaster_ttgo_wifi_sd/spiffs.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: disahrsterradio-offline-map-heimersheim
          path: maps/
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python tools/build_demo.py
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: disahrsterradio-gui-check
          path: test-results/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: disahrsterradio-ahrtal-demo
          path: docs/demo/
          if-no-files-found: error

  # Release-Boards: LILYGO T-Deck Plus und T-Watch S3 (ESP32-S3, SX1262, Marken-Anzeige)
  release-boards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [disaster_tdeck_wifi, disaster_twatch_s3_wifi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Weboberfläche einbetten und auf Abweichung prüfen
        run: python tools/embed_web.py && git diff --exit-code -- firmware/MeshCore/examples/companion_radio/PortalPage.h firmware/MeshCore/examples/companion_radio/PortalAssets.h
      - name: Firmware bauen
        shell: bash
        run: set -o pipefail; python -m platformio run -j 2 -d firmware/MeshCore -e ${{ matrix.env }} | tee build-${{ matrix.env }}.log
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e ${{ matrix.env }} -t mergebin
      - run: python -m platformio run -j 2 -d firmware/MeshCore -e ${{ matrix.env }} -t buildfs
      - name: Flash/Header/Partitionen/Firmware und RAM prüfen
        run: >-
          python tools/validate_memory.py --env ${{ matrix.env }}
          --build-dir firmware/MeshCore/.pio/build/${{ matrix.env }} --build-log build-${{ matrix.env }}.log
          --output memory/${{ matrix.env }} && cat memory/${{ matrix.env }}.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: |
            firmware/MeshCore/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/MeshCore/.pio/build/${{ matrix.env }}/firmware-merged.bin
            firmware/MeshCore/.pio/build/${{ matrix.env }}/spiffs.bin
            memory/${{ matrix.env }}.md
            memory/${{ matrix.env }}.json
          if-no-files-found: error
