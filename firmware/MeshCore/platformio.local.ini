[env:disaster_t3s3_sx1262_wifi_gps]
; Optional: externes NMEA-GPS-Modul (z. B. ATGM336H, NEO-6M, L76K) an UART1.
; PIN_GPS_TX = GPIO, an dem der TX-Ausgang des Moduls haengt (Board empfaengt).
; PIN_GPS_RX = GPIO, an dem der RX-Eingang des Moduls haengt (Board sendet).
; 43/44 sind die mit TX/RX beschrifteten Pins am T3-S3; vor dem Anschluss pruefen.
extends = env:disaster_t3s3_sx1262_wifi
build_src_filter = ${env:disaster_t3s3_sx1262_wifi.build_src_filter}
  +<helpers/sensors/EnvironmentSensorManager.cpp>
build_flags =
  ${env:disaster_t3s3_sx1262_wifi.build_flags}
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=44
  -D PIN_GPS_RX=43
  -D GPS_BAUD_RATE=9600
  -D DISASTER_GPS=1
lib_deps =
  ${env:disaster_t3s3_sx1262_wifi.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6

