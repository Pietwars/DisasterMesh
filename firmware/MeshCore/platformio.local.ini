[env:disaster_ttgo_wifi]
test_framework = custom
lib_ldf_mode = deep+
extends = env:LilyGo_TLora_V2_1_1_6_companion_radio_usb
build_unflags =
  ${LilyGo_TLora_V2_1_1_6.build_unflags}
  -D LORA_TX_POWER=20
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  ${sensor_base.build_flags}
build_flags =
  ${LilyGo_TLora_V2_1_1_6.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=64
  -D MAX_GROUP_CHANNELS=8
  -D LORA_TX_POWER=10
  -D DISASTER_PORTAL=1
  -D OFFLINE_QUEUE_SIZE=64
  -D FIRMWARE_VERSION='"v1.17.1-dr0.4"'
lib_deps =
  SPI
  Wire

# Dedicated relay role. No portal, BLE or Wi-Fi OTA; USB CLI for setup.
[env:disaster_ttgo_repeater]
extends = env:LilyGo_TLora_V2_1_1_6_repeater
test_framework = custom
lib_ldf_mode = deep+
build_unflags =
  ${LilyGo_TLora_V2_1_1_6.build_unflags}
  -D LORA_TX_POWER=20
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  ${sensor_base.build_flags}
build_flags =
  ${LilyGo_TLora_V2_1_1_6.build_flags}
  -D LORA_TX_POWER=10
  -D DISASTER_REPEATER=1
  -D DISABLE_WIFI_OTA=1
  -D ADMIN_PASSWORD='""'
  -D ADVERT_NAME='"DisasterMesh-Relay"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D MAX_NEIGHBOURS=50
  -D FIRMWARE_VERSION='"v1.17.1-dr0.4-relay"'
lib_deps =
  SPI
  Wire

[env:disaster_ttgo_room]
extends = env:LilyGo_TLora_V2_1_1_6_room_server
test_framework = custom
lib_ldf_mode = deep+
build_unflags =
  ${LilyGo_TLora_V2_1_1_6.build_unflags}
  -D LORA_TX_POWER=20
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  ${sensor_base.build_flags}
build_flags =
  ${LilyGo_TLora_V2_1_1_6.build_flags}
  -D LORA_TX_POWER=10
  -D DISASTER_ROOM=1
  -D DISABLE_WIFI_OTA=1
  -D ADMIN_PASSWORD='""'
  -D ROOM_PASSWORD='""'
  -D ADVERT_NAME='"DisasterMesh-Brett"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D MAX_UNSYNCED_POSTS=32
  -D FIRMWARE_VERSION='"v1.17.1-dr0.4-room"'
lib_deps =
  SPI
  Wire
