  -D P_LORA_RESET=14
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  ${sensor_base.build_flags}
build_flags =
  ${LilyGo_TLora_V2_1_1_6.build_flags}
  -D LORA_TX_POWER=10
  -D LORA_CR=8
  -D P_LORA_RESET=23
  -D DISASTER_REPEATER=1
  -D DISABLE_WIFI_OTA=1
  -D ADMIN_PASSWORD='""'
  -D ADVERT_NAME='"DisAHRsterRadio-Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D MAX_NEIGHBOURS=50
  -D FIRMWARE_VERSION='"v1.18.0-ahr0.9.0-alpha-relay"'
lib_deps =
  ${dm_classic_slim.lib_deps}
  ${esp32_ota.lib_deps}
lib_ignore =
  ${dm_classic_slim.lib_ignore}

