# Optional SD socket profile; manufacturer T3 V1.6 layout, separate VSPI bus (LoRa uses HSPI).
[env:disaster_ttgo_wifi_sd]
extends = env:disaster_ttgo_wifi
build_flags =
  ${env:disaster_ttgo_wifi.build_flags}
  -D DISASTER_SD=1

# T3-S3 V1.3: distinct 868 MHz radio-chip profiles. Never select by frequency alone.

[env:disaster_t3s3_sx1262_wifi]
extends = env:LilyGo_T3S3_sx1262_companion_radio_usb
test_framework = custom
lib_ldf_mode = deep+
