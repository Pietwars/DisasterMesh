# Schlanke Profile fuer klassische ESP32 (TTGO / LILYGO T3 V1.6.1 / TLora V2.1-1.6) ohne Zusatzsensoren.
# Die Upstream-Variante LilyGo_TLora_V2_1_1_6 zieht ueber sensor_base ~15 Sensorbibliotheken (INA*, AHTX0,
# BME280/680, BMP280/085, SHTC3, SHT4x, LPS22HB, MLX90614, VL53L0X, MicroNMEA) und ihr build_unflags = -Os
# entfernt die Optimierung ganz (auch das -Os aus build_flags -> -O0). Die Profile unten uebernehmen dieses
# build_unflags nicht (-Os wie bei allen anderen Boards), bauen nur die benoetigten Bibliotheken und sperren
# die Sensorbibliotheken per lib_ignore. ENV_INCLUDE_* sind dort aus, der Sensorcode in
# EnvironmentSensorManager faellt beim Kompilieren weg; Batterie-Telemetrie bleibt.
[dm_classic_slim]
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
lib_ignore =
  Adafruit INA3221 Library
  Adafruit INA219
  INA226
  Adafruit INA260 Library
  Adafruit AHTX0
  Adafruit BME280 Library
  Adafruit BMP280 Library
  Adafruit SHTC3 Library
  Sensirion I2C SHT4x
  Sensirion Core
  Arduino_LPS22HB
  Adafruit MLX90614 Library
  Adafruit_VL53L0X
  MicroNMEA
  Adafruit BME680 Library
  Adafruit BMP085 Library
  BSEC Software Library
  Adafruit Unified Sensor

[env:disaster_ttgo_wifi]
test_framework = custom
lib_ldf_mode = deep+
extends = env:LilyGo_TLora_V2_1_1_6_companion_radio_usb
build_unflags =
  ; kein ${LilyGo_TLora_V2_1_1_6.build_unflags}: das wuerde -Os entfernen (-O0, ~0,5 MB groesser)
  -D LORA_TX_POWER=20
  -D P_LORA_RESET=14
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  ${sensor_base.build_flags}
build_flags =
  ${LilyGo_TLora_V2_1_1_6.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=64
  -D MAX_GROUP_CHANNELS=8
  -D LORA_TX_POWER=10
  -D LORA_CR=8
  -D P_LORA_RESET=23
  -D DISASTER_PORTAL=1
  -D OFFLINE_QUEUE_SIZE=64
  -D FIRMWARE_VERSION='"v1.18.0-ahr0.9.0-alpha"'
lib_deps =
  ${dm_classic_slim.lib_deps}
  densaugeo/base64 @ ~1.4.0
lib_ignore =
  ${dm_classic_slim.lib_ignore}

# Dedicated relay role. No portal, BLE or Wi-Fi OTA; USB CLI for setup.
