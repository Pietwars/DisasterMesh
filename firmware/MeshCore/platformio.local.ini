  -D LORA_TX_POWER=20
  -D P_LORA_RESET=14
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  ${sensor_base.build_flags}
build_flags =
  ${LilyGo_TLora_V2_1_1_6.build_flags}
  -D LORA_TX_POWER=10
  -D LORA_CR=8
  -D P_LORA_RESET=23
  -D DISASTER_REPEATER=1
  -D DISABLE_WIFI_OTA=1
  -D ADMIN_PASSWORD='""'
  -D ADVERT_NAME='"DisAHRsterRadio-Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D MAX_NEIGHBOURS=50
  -D FIRMWARE_VERSION='"v1.17.1-ahr0.8.0-relay"'
lib_deps =
  SPI
  Wire

